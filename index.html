<!DOCTYPE html>
<html lang="en">
<head>
<meta name="game-uuid" content="c9b8ddee-eb37-4a12-baa4-5793c612dd3f" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Block Hop</title>
<script src="./aigram-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#15110e; --paper:#fff7e6; --paper2:#ffeec4;
    --yellow:#ffce2e; --red:#ff4438; --teal:#3fb6ac;
    --comic:"Bangers","PingFang SC",sans-serif;
    --pow:"Luckiest Guy","PingFang SC",sans-serif;
  }
  html, body {
    margin:0; height:100%; overflow:hidden; background:#b8d7ea;
    font-family:-apple-system,"PingFang SC",BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap { position:fixed; inset:0; overflow:hidden; }
  #c { display:block; width:100%; height:100%; touch-action:none; }

  .hud { position:fixed; pointer-events:none; z-index:5; }

  #wordmark {
    top:14px; left:50%; transform:translateX(-50%);
    font-family:var(--comic); color:var(--yellow);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke fill;
    font-size:34px; letter-spacing:.04em;
    text-shadow:3px 3px 0 var(--ink);
    transition:opacity .3s, transform .3s;
  }
  #wordmark.hidden { opacity:0; transform:translate(-50%, -20px); }

  #dist {
    top:18px; left:50%; transform:translateX(-50%);
    font-family:var(--comic); color:var(--ink);
    background:var(--paper); padding:4px 18px; border-radius:999px;
    border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
    font-size:28px; font-variant-numeric:tabular-nums; line-height:1;
    opacity:0; transition:opacity .25s;
  }
  #dist.show { opacity:1; }
  #dist .lbl {
    font-size:11px; letter-spacing:.18em; color:#8a7d72;
    display:block; margin-bottom:1px;
  }

  #coin {
    top:18px; left:14px;
    display:flex; align-items:center; gap:8px;
    padding:5px 16px 5px 6px; border-radius:999px;
    background:var(--paper); border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    font-family:var(--comic); font-size:24px; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:.02em; line-height:1;
  }
  #coin .c {
    width:28px; height:28px; flex:0 0 auto; border-radius:50%;
    background:var(--yellow); border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--comic); font-size:16px;
  }

  /* Swipe tutorial — animated finger swiping up, with label, title state only */
  #tut {
    position:fixed; left:50%; bottom:30%; z-index:5;
    width:0; height:0; pointer-events:none;
    opacity:0; transition:opacity .4s;
  }
  #tut.show { opacity:1; }
  #tut .ttrail {
    position:absolute; left:-5px; bottom:14px;
    width:10px; height:0; border-radius:999px;
    background:linear-gradient(to top, rgba(255,255,255,0), rgba(255,255,255,.85));
    animation:ttrail 1.7s ease-in-out infinite;
  }
  #tut .tdot {
    position:absolute; left:-14px; bottom:0;
    width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,.95); border:3px solid var(--ink);
    box-shadow:0 0 14px rgba(255,255,255,.55);
    animation:tswipe 1.7s ease-in-out infinite;
  }
  #tut .tlabel {
    position:absolute; left:-150px; top:26px; width:300px;
    text-align:center; color:#fff;
    font-family:var(--comic); font-size:22px;
    text-shadow:2px 2px 0 rgba(21,17,14,.55);
    letter-spacing:.04em;
  }
  @keyframes tswipe {
    0%        { transform:translateY(0); opacity:0; }
    12%       { opacity:1; }
    58%       { transform:translateY(-90px); opacity:1; }
    72%, 100% { transform:translateY(-90px); opacity:0; }
  }
  @keyframes ttrail {
    0%, 8%    { height:0; opacity:0; }
    18%       { opacity:.9; }
    58%       { height:86px; opacity:.9; }
    72%, 100% { height:86px; opacity:0; }
  }

  /* Finger trail overlay — echoes the swipe back at the player */
  #trail {
    position:fixed; inset:0; z-index:4; pointer-events:none;
  }

  #over {
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(21,17,14,.55); z-index:30; padding:24px;
    pointer-events:auto;
  }
  #over.show { display:flex; }
  #over .card {
    box-sizing:border-box;
    background:var(--paper); color:var(--ink);
    padding:24px 22px 20px; border-radius:8px;
    border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
    text-align:center; max-width:340px; width:100%;
    transform:rotate(-1deg);
  }
  #over h1 {
    font-family:var(--pow); font-size:clamp(38px,13vw,52px); color:var(--red);
    -webkit-text-stroke:3px var(--ink); paint-order:stroke fill;
    margin:0 0 4px; letter-spacing:.02em; transform:rotate(2deg);
    white-space:nowrap;
  }
  #over .reason {
    font-family:var(--comic); font-size:20px; color:var(--ink);
    margin-bottom:14px; letter-spacing:.06em;
  }
  #over .row {
    display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 4px; border-bottom:1.5px dashed rgba(21,17,14,.25);
    font-family:var(--comic); font-size:22px; line-height:1.1;
  }
  #over .row:last-of-type { border-bottom:none; margin-bottom:10px; }
  #over .row .k { color:#8a7d72; font-size:13px; letter-spacing:.16em; }
  #over .row .v { font-variant-numeric:tabular-nums; }
  #over .row.best .v { color:var(--red); }
  #over button {
    display:block; margin:14px auto 0;
    padding:12px 26px; border:3px solid var(--ink);
    background:var(--yellow); color:var(--ink);
    font-family:var(--comic); font-size:26px; letter-spacing:.04em;
    border-radius:999px; box-shadow:4px 4px 0 var(--ink); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #over button:active { transform:translate(2px, 2px); box-shadow:2px 2px 0 var(--ink); }

  /* Revive — premium teal action above "Hop again" */
  #over #revive {
    background:var(--teal); color:#fff; font-size:24px;
    -webkit-text-stroke:1px var(--ink); paint-order:stroke fill;
    display:none;
  }
  #over #revive.show { display:block; }
  #over #revive.broke { background:#cfc8bc; color:#8a8175; cursor:default; }
  #over #revive .px { font-size:16px; opacity:.92; }

  /* D-pad visibility switch — bottom-left round button */
  #padToggle {
    position:fixed; left:14px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:6;
    width:46px; height:46px; border-radius:50%; padding:0;
    background:rgba(255,247,230,.75); border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink); cursor:pointer; pointer-events:auto;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  #padToggle svg { width:24px; height:24px; display:block; pointer-events:none; }
  #padToggle svg path { fill:#9b8e80; }
  #padToggle.on { background:var(--yellow); }
  #padToggle.on svg path { fill:var(--ink); }
  #padToggle:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }

  /* On-screen D-pad — bottom center, off by default (toggle to show) */
  #dpad {
    position:fixed; z-index:6; pointer-events:none;
    left:50%; transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(3, 54px);
    grid-template-rows:repeat(2, 54px);
    row-gap:6px; column-gap:8px;
  }
  #dpad.hidden { display:none; }
  #dpad button {
    pointer-events:auto; padding:0; cursor:pointer;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    border:3px solid var(--ink); border-radius:14px;
    background:rgba(255,247,230,.92); color:var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  #dpad button svg { width:24px; height:24px; pointer-events:none; display:block; }
  #dpad button svg polygon { fill:var(--ink); }
  #dpad button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  /* Up/Down stacked in the middle; Left/Right flank, vertically centered on the pair */
  #bUp    { grid-column:2; grid-row:1; }
  #bDown  { grid-column:2; grid-row:2; }
  #bLeft  { grid-column:1; grid-row:1 / 3; align-self:center; height:54px; }
  #bRight { grid-column:3; grid-row:1 / 3; align-self:center; height:54px; }

  /* Always-visible champion pill — tap to open the full leaderboard */
  #lb {
    position:fixed; top:74px; right:14px; z-index:5; pointer-events:auto;
    display:none; flex-direction:column; gap:6px; align-items:flex-end;
  }
  #lb.show { display:flex; }
  .lbrow .crown { width:16px; height:16px; flex:0 0 auto; display:block; }
  .lbrow .crown path { fill:var(--yellow); stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round; }
  .lbrow:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }

  /* Full leaderboard overlay */
  #lbFull {
    position:fixed; inset:0; display:none; z-index:40; padding:20px;
    align-items:center; justify-content:center;
    background:rgba(21,17,14,.6); pointer-events:auto;
  }
  #lbFull.show { display:flex; }
  #lbFull .lcard {
    background:var(--paper); border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
    border-radius:10px; width:100%; max-width:380px; max-height:84vh;
    display:flex; flex-direction:column; padding:18px 16px 14px;
  }
  #lbFull h2 {
    font-family:var(--pow); font-size:30px; color:var(--ink); margin:0 0 10px;
    text-align:center; letter-spacing:.02em;
  }
  #lblist {
    display:flex; flex-direction:column; gap:7px;
    overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px;
  }
  .lfrow {
    display:flex; align-items:center; gap:9px;
    border:2.5px solid var(--ink); border-radius:8px; background:#fffdf6;
    padding:7px 12px 7px 8px; cursor:pointer;
    font-family:var(--comic); font-size:17px; color:var(--ink); line-height:1;
    -webkit-tap-highlight-color:transparent;
  }
  .lfrow .rk { font-size:14px; min-width:26px; text-align:center; color:#8a7d72; }
  .lfrow .av, .lfrow .avf {
    width:30px; height:30px; border-radius:50%; border:2px solid var(--ink);
    flex:0 0 auto; display:block; object-fit:cover;
  }
  .lfrow .avf {
    background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .lfrow .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lfrow .sc { font-variant-numeric:tabular-nums; }
  .lfrow.me { cursor:default; background:#fff6df; }
  .lfrow.me .nm { color:var(--red); }
  .lfrow.top1 .rk { color:var(--ink); }
  #lbClose {
    margin-top:12px; align-self:center; padding:8px 24px; border:3px solid var(--ink);
    background:var(--yellow); color:var(--ink); font-family:var(--comic); font-size:20px;
    border-radius:999px; box-shadow:3px 3px 0 var(--ink); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .lbrow {
    display:flex; align-items:center; gap:6px;
    background:rgba(255,247,230,.92); border:2.5px solid var(--ink);
    border-radius:999px; padding:3px 10px 3px 4px;
    box-shadow:2px 2px 0 var(--ink);
    font-family:var(--comic); font-size:14px; color:var(--ink); line-height:1;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .lbrow .rk { font-size:12px; min-width:14px; text-align:center; color:#8a7d72; }
  .lbrow .av, .lbrow .avf {
    width:22px; height:22px; border-radius:50%; border:2px solid var(--ink);
    flex:0 0 auto; display:block; object-fit:cover;
  }
  .lbrow .avf {
    background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
  }
  .lbrow .nm { max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lbrow .sc { font-variant-numeric:tabular-nums; }
  .lbrow.me { cursor:default; }
  .lbrow.me .nm { color:var(--red); }

  /* Roster open button — top-right pill */
  #rosterBtn {
    position:fixed; top:18px; right:14px; z-index:6; pointer-events:auto;
    padding:6px 14px; border-radius:999px;
    background:var(--paper); border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    font-family:var(--comic); font-size:18px; color:var(--ink);
    letter-spacing:.04em; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  #rosterBtn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  #rosterBtn.hidden { display:none; }

  /* Roster link on the death card */
  #over #rosterCard {
    background:none; box-shadow:none; border:none; color:#8a7d72;
    font-size:18px; margin:8px auto 0; padding:4px;
    text-decoration:underline; text-underline-offset:3px;
  }
  #over #rosterCard:active { transform:none; }

  /* Roster overlay */
  #roster {
    position:fixed; inset:0; display:none; z-index:40; padding:20px;
    align-items:center; justify-content:center;
    background:rgba(21,17,14,.6); pointer-events:auto;
  }
  #roster.show { display:flex; }
  #roster .rcard {
    background:var(--paper); border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
    border-radius:10px; width:100%; max-width:380px; max-height:84vh;
    display:flex; flex-direction:column; padding:18px 16px 14px;
  }
  #roster h2 {
    font-family:var(--pow); font-size:30px; color:var(--ink); margin:0 0 2px;
    text-align:center; letter-spacing:.02em;
  }
  #roster .rcoins {
    display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px;
    font-family:var(--comic); font-size:20px; color:var(--ink);
  }
  #roster .rcoins .c {
    width:22px; height:22px; border-radius:50%; background:var(--yellow);
    border:2px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-family:var(--comic); font-size:13px;
  }
  #rgrid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px;
  }
  .ritem {
    border:2.5px solid var(--ink); border-radius:8px; background:#fffdf6;
    padding:6px 4px 7px; text-align:center; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .ritem.locked { background:#efe7d6; }
  .ritem.locked .rthumb { filter:grayscale(.85) brightness(.9); opacity:.7; }
  .ritem img.rthumb { width:100%; aspect-ratio:1/1; display:block; image-rendering:auto; }
  .ritem .rname {
    font-family:var(--comic); font-size:13px; color:var(--ink);
    line-height:1.05; margin-top:2px; letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ritem .rtag {
    margin-top:3px; font-family:var(--comic); font-size:12px; line-height:1;
    display:inline-block; padding:2px 8px; border-radius:999px; letter-spacing:.04em;
  }
  .ritem .rtag.own  { color:var(--teal); }
  .ritem .rtag.buy  { background:var(--yellow); border:2px solid var(--ink); color:var(--ink); }
  .ritem .rtag.cant { background:#ded6c7; border:2px solid #b3a994; color:#8a8175; }
  #rClose {
    margin-top:12px; align-self:center; padding:8px 24px; border:3px solid var(--ink);
    background:var(--yellow); color:var(--ink); font-family:var(--comic); font-size:20px;
    border-radius:999px; box-shadow:3px 3px 0 var(--ink); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #rClose:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="wordmark" class="hud">BLOCK HOP</div>
  <div id="dist" class="hud"><span class="lbl">DISTANCE</span><span id="distN">0</span></div>
  <div id="coin" class="hud"><span class="c">$</span><span id="coinN">0</span></div>
  <canvas id="trail"></canvas>
  <div id="tut" class="hud">
    <div class="ttrail"></div>
    <div class="tdot"></div>
    <div class="tlabel">Swipe to move &middot; tap to hop</div>
  </div>
  <button id="rosterBtn">CHARACTERS</button>
  <div id="lb"></div>
  <div id="lbFull">
    <div class="lcard">
      <h2>BEST HOPPERS</h2>
      <div id="lblist"></div>
      <button id="lbClose">CLOSE</button>
    </div>
  </div>
  <button id="padToggle" aria-label="Toggle on-screen buttons"><svg viewBox="0 0 24 24"><path d="M9 3 h6 v6 h6 v6 h-6 v6 H9 v-6 H3 V9 h6 Z"/></svg></button>
  <div id="dpad" class="hidden">
    <button id="bUp" aria-label="Forward"><svg viewBox="0 0 24 24"><polygon points="12,4 21,20 3,20"/></svg></button>
    <button id="bLeft" aria-label="Left"><svg viewBox="0 0 24 24"><polygon points="4,12 20,3 20,21"/></svg></button>
    <button id="bRight" aria-label="Right"><svg viewBox="0 0 24 24"><polygon points="20,12 4,3 4,21"/></svg></button>
    <button id="bDown" aria-label="Back"><svg viewBox="0 0 24 24"><polygon points="12,20 21,4 3,4"/></svg></button>
  </div>
</div>

<div id="over">
  <div class="card">
    <h1>SQUISHED!</h1>
    <div class="reason" id="reason">flattened by a yellow cab</div>
    <div class="row"><span class="k">DISTANCE</span><span class="v" id="finalDist">0</span></div>
    <div class="row best"><span class="k">BEST</span><span class="v" id="finalBest">0</span></div>
    <div class="row"><span class="k">COINS</span><span class="v" id="finalCoins">0</span></div>
    <button id="revive">Revive <span class="px">($<span id="reviveCost">0</span>)</span></button>
    <button id="again">Hop again</button>
    <button id="rosterCard">Characters</button>
  </div>
</div>

<div id="roster">
  <div class="rcard">
    <h2>CHARACTERS</h2>
    <div class="rcoins"><span class="c">$</span><span id="rCoinN">0</span> coins</div>
    <div id="rgrid"></div>
    <button id="rClose">Close</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import { startGame } from './game.js';

const $ = (s) => document.querySelector(s);
const canvas = $('#c');
const distEl = $('#distN');
const coinEl = $('#coinN');
const overEl = $('#over');
const wordmarkEl = $('#wordmark');
const distBoxEl = $('#dist');
const hintEl = $('#tut');
const reviveBtn = $('#revive');
const reviveCostEl = $('#reviveCost');
const rosterBtnEl = $('#rosterBtn');

const REASONS = {
  car:    'flattened by a yellow cab',
  train:  'caught by the express train',
  drown:  'into the East River you go',
  drift:  'log drifted you off the map',
  void:   'stepped into the void',
  camera: 'the city left without you',
};

let firstHopSeen = false;

const hud = {
  setDistance(n){
    distEl.textContent = String(n);
    if (n > 0 && !firstHopSeen){
      firstHopSeen = true;
      wordmarkEl.classList.add('hidden');
      distBoxEl.classList.add('show');
      hintEl.classList.remove('show');
      rosterBtnEl.classList.add('hidden');   // no mid-run browsing (game keeps running)
    }
  },
  setCoin(n){ coinEl.textContent = String(n); },
  setDead(payload){
    if (!payload){
      overEl.classList.remove('show');
      // restore title state
      firstHopSeen = false;
      wordmarkEl.classList.remove('hidden');
      distBoxEl.classList.remove('show');
      hintEl.classList.add('show');
      distEl.textContent = '0';
      rosterBtnEl.classList.remove('hidden');
      return;
    }
    $('#reason').textContent = REASONS[payload.reason] || 'gone';
    $('#finalDist').textContent = String(payload.distance);
    $('#finalBest').textContent = String(payload.best);
    $('#finalCoins').textContent = String(payload.coins);
    // Revive button: show cost, grey out if the player can't afford it.
    const info = api.reviveInfo();
    reviveBtn.classList.add('show');
    reviveCostEl.textContent = String(info.cost);
    reviveBtn.classList.toggle('broke', !info.canAfford);
    overEl.classList.add('show');
    setTimeout(refreshLB, 1200);   // pull the board again once the new score has landed
  },
  setReady(){
    hintEl.classList.add('show');
  },
};

const api = startGame({ canvas, hud });

// On-screen D-pad — opt-in via the bottom-left switch (swipe is the primary input)
function bindHop(sel, dx, dz){
  $(sel).addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    api.hop(dx, dz);
  });
}
bindHop('#bUp', 0, 1);
bindHop('#bLeft', -1, 0);
bindHop('#bRight', 1, 0);
bindHop('#bDown', 0, -1);

const padEl = $('#dpad');
const padToggleEl = $('#padToggle');
function setPad(on){
  padEl.classList.toggle('hidden', !on);
  padToggleEl.classList.toggle('on', on);
  try { localStorage.setItem('bh_pad', on ? '1' : '0'); } catch (e) {}
}
setPad(localStorage.getItem('bh_pad') === '1');
padToggleEl.addEventListener('click', () => setPad(padEl.classList.contains('hidden')));

// ── Finger trail — echo every drag/tap so swiping reads as the native input ──
const trailC = $('#trail');
const trailX = trailC.getContext('2d');
let trailPts = [];
let trailDown = false;
let trailDirty = false;
function trailSize(){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  trailC.width = Math.round(innerWidth * d);
  trailC.height = Math.round(innerHeight * d);
  trailX.setTransform(d, 0, 0, d, 0, 0);
}
trailSize();
addEventListener('resize', trailSize);
addEventListener('pointerdown', (e) => {
  trailDown = true;
  trailPts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
addEventListener('pointermove', (e) => {
  if (trailDown) trailPts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
addEventListener('pointerup', () => { trailDown = false; }, { passive: true });
addEventListener('pointercancel', () => { trailDown = false; }, { passive: true });
const TRAIL_MS = 380;
(function trailLoop(){
  requestAnimationFrame(trailLoop);
  if (!trailPts.length){
    if (trailDirty){ trailX.clearRect(0, 0, innerWidth, innerHeight); trailDirty = false; }
    return;
  }
  const now = performance.now();
  trailPts = trailPts.filter((p) => now - p.t < TRAIL_MS);
  trailX.clearRect(0, 0, innerWidth, innerHeight);
  trailDirty = true;
  trailX.lineCap = 'round';
  trailX.lineJoin = 'round';
  for (let i = 1; i < trailPts.length; i++){
    const a = trailPts[i - 1], b = trailPts[i];
    const k = 1 - (now - b.t) / TRAIL_MS;
    trailX.strokeStyle = 'rgba(255,255,255,' + (k * 0.8).toFixed(3) + ')';
    trailX.lineWidth = 12 * k + 2;
    trailX.beginPath(); trailX.moveTo(a.x, a.y); trailX.lineTo(b.x, b.y); trailX.stroke();
  }
  // Lone point (a tap, no drag): show a fading touch dot instead of a stroke
  if (trailPts.length === 1){
    const p = trailPts[0];
    const k = 1 - (now - p.t) / TRAIL_MS;
    trailX.fillStyle = 'rgba(255,255,255,' + (k * 0.7).toFixed(3) + ')';
    trailX.beginPath(); trailX.arc(p.x, p.y, 8 + 10 * (1 - k), 0, Math.PI * 2); trailX.fill();
  }
})();

$('#again').addEventListener('click', () => api.restart());

reviveBtn.addEventListener('click', () => {
  if (reviveBtn.classList.contains('broke')) return;
  if (api.revive()){
    reviveBtn.classList.remove('show');
    overEl.classList.remove('show');   // resume the run; keep HUD/title state intact
  }
});

// ── Champion pill (always visible) + full leaderboard overlay ────────────────
const lbEl = $('#lb');
const lbFullEl = $('#lbFull');
const lblistEl = $('#lblist');
let lbData = { rows: [], meId: '' };

function lbInitial(name){
  const d = document.createElement('span');
  d.className = 'avf';
  d.textContent = ((name || '?').trim().charAt(0) || '?').toUpperCase();
  return d;
}

function lbAvatar(r){
  if (r.head_url){
    const img = document.createElement('img');
    img.className = 'av'; img.src = r.head_url; img.alt = ''; img.draggable = false;
    img.onerror = () => img.replaceWith(lbInitial(r.user_name));
    return img;
  }
  return lbInitial(r.user_name);
}

function lbChampionPill(r, isMe){
  const row = document.createElement('div');
  row.className = 'lbrow' + (isMe ? ' me' : '');
  row.innerHTML = '<svg class="crown" viewBox="0 0 24 24"><path d="M3 18 L2 7 L8 12 L12 4 L16 12 L22 7 L21 18 Z"/></svg>';
  row.appendChild(lbAvatar(r));
  const nm = document.createElement('span');
  let name = (r.user_name || '?').trim();
  if (name.length > 8) name = name.slice(0, 8) + '…';
  nm.className = 'nm'; nm.textContent = isMe ? 'YOU' : name;
  row.appendChild(nm);
  const sc = document.createElement('span');
  sc.className = 'sc'; sc.textContent = String(Number(r.score) || 0);
  row.appendChild(sc);
  row.addEventListener('click', openLbFull);
  return row;
}

function lbFullRow(r, isMe){
  const row = document.createElement('div');
  row.className = 'lfrow' + (isMe ? ' me' : '') + (r.rank === 1 ? ' top1' : '');
  const rk = document.createElement('span');
  rk.className = 'rk'; rk.textContent = '#' + r.rank;
  row.appendChild(rk);
  row.appendChild(lbAvatar(r));
  const nm = document.createElement('span');
  nm.className = 'nm'; nm.textContent = isMe ? 'YOU' : (r.user_name || '?');
  row.appendChild(nm);
  const sc = document.createElement('span');
  sc.className = 'sc'; sc.textContent = String(Number(r.score) || 0);
  row.appendChild(sc);
  if (!isMe && r.user_id){
    row.addEventListener('click', () => window.Aigram && window.Aigram.openAigramProfile(r.user_id));
  }
  return row;
}

function openLbFull(){
  lblistEl.innerHTML = '';
  for (const r of lbData.rows) lblistEl.appendChild(lbFullRow(r, String(r.user_id) === lbData.meId));
  lbFullEl.classList.add('show');
  refreshLB();   // re-pull in the background so next open is fresh
}
$('#lbClose').addEventListener('click', () => lbFullEl.classList.remove('show'));

function renderLB(rows, meId){
  if (!rows.length){ lbEl.classList.remove('show'); return; }
  rows = rows.slice().sort((a, b) => (a.rank || 999) - (b.rank || 999));
  lbData = { rows, meId };
  lbEl.innerHTML = '';
  lbEl.appendChild(lbChampionPill(rows[0], String(rows[0].user_id) === meId));
  lbEl.classList.add('show');
}
window.__lbRender = renderLB;   // debug/screenshot hook

async function refreshLB(){
  const A = window.Aigram;
  if (!A || !A.canRank) return;
  try {
    const res = await A.callAigramAPI('/note/aigram/ai/game/rank/score/list/by/session_id?session_id=' + A.gameUuid, 'GET');
    const rows = Array.isArray(res) ? res : (res && res.data) || [];   // bare array vs {data:[]} both seen in the wild
    renderLB(rows, String(A.telegramId));
  } catch (e) { /* keep whatever is shown */ }
}
refreshLB();

// ── Character roster overlay ──────────────────────────────────────────────────
const rosterEl = $('#roster');
const rgridEl = $('#rgrid');
const rCoinEl = $('#rCoinN');
const thumbCache = {};

function thumbFor(key){
  if (!thumbCache[key]) thumbCache[key] = api.thumb(key);
  return thumbCache[key];
}

function renderRoster(){
  rCoinEl.textContent = String(api.getCoins());
  const list = api.getRoster();
  const coins = api.getCoins();
  rgridEl.innerHTML = '';
  for (const item of list){
    const cell = document.createElement('div');
    cell.className = 'ritem' + (item.unlocked ? '' : ' locked');
    const img = document.createElement('img');
    img.className = 'rthumb'; img.alt = item.name; img.draggable = false;
    img.src = thumbFor(item.key);
    const name = document.createElement('div');
    name.className = 'rname'; name.textContent = item.name;
    const tag = document.createElement('span');
    if (item.unlocked){
      tag.className = 'rtag own'; tag.textContent = 'OWNED';
    } else if (coins >= 20){
      tag.className = 'rtag buy'; tag.textContent = '$20';
      cell.addEventListener('click', () => { if (api.unlock(item.key)) renderRoster(); });
    } else {
      tag.className = 'rtag cant'; tag.textContent = '$20';
    }
    cell.appendChild(img); cell.appendChild(name); cell.appendChild(tag);
    rgridEl.appendChild(cell);
  }
}

function openRoster(){ renderRoster(); rosterEl.classList.add('show'); }
$('#rosterBtn').addEventListener('click', openRoster);
$('#rosterCard').addEventListener('click', openRoster);
$('#rClose').addEventListener('click', () => rosterEl.classList.remove('show'));
</script>
</body>
</html>
